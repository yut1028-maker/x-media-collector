name: Build unsigned iOS ipa

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install JS dependencies
        run: npm install

      - name: Expo prebuild (generate native iOS project)
        run: npx expo prebuild --platform ios --non-interactive

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: List available schemes (for debugging)
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace)
          echo "Workspace: $WORKSPACE"
          echo "All schemes:"
          xcodebuild -list -workspace "$WORKSPACE"

      - name: Build (unsigned)
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace)
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "XMediaCollector" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned ipa
        run: |
          echo "Searching for .app bundle under ios/build ..."
          APP_PATH=$(find ios/build -type d -iname "*.app" | grep -v "\.framework" | head -n1)
          echo "Found app bundle at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found! Full tree under ios/build:"
            find ios/build -maxdepth 6
            exit 1
          fi
          APP_DIR=$(dirname "$APP_PATH")
          APP_NAME=$(basename "$APP_PATH")
          cd "$APP_DIR"
          mkdir Payload
          mv "$APP_NAME" Payload/
          zip -r app-unsigned.ipa Payload
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp app-unsigned.ipa "$GITHUB_WORKSPACE/output/"

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned-ipa
          path: output/app-unsigned.ipa
